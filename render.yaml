services:
  - type: web
    name: aegis-fx-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SYMBOL
        value: GBPJPY=X
      - key: INTERVAL
        value: 1d
      - key: MODE
        value: SSL-HYBRID
      - key: FILTER
        value: HULL
